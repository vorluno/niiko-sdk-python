[project]
name = "niiko"
version = "0.1.0"
description = "Generated client for the niiko actions API — it exposes verbs, not rows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vorluno", email = "contacto@vorluno.dev" }]
keywords = ["niiko", "api", "sdk", "crm", "leads"]
# Sin dependencias: urllib viene con Python.
dependencies = []

[project.urls]
Homepage = "https://developers.niiko.org"
Repository = "https://github.com/vorluno/niiko-sdk-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["niiko.py"]
